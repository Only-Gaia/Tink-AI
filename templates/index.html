<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tink IA</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f6fa;
    --panel-2: #ffffff;
    --border: #e2e4ec;
    --accent: #2f5cff;
    --accent-text: #ffffff;
    --text: #1a1c23;
    --text-dim: #6b7080;
    --bubble-user: #2f5cff;
    --bubble-user-text: #ffffff;
    --bubble-ai: #f0f1f6;
    --bubble-ai-text: #1a1c23;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  /* ---- Login / Registrazione ---- */
  #auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 20px;
    background: var(--panel);
  }
  .auth-box {
    background: var(--panel-2);
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    max-width: 360px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(20, 20, 40, 0.06);
  }
  .auth-box h1 {
    margin: 0 0 4px;
    font-size: 24px;
    color: var(--text);
  }
  .auth-box p.subtitle {
    color: var(--text-dim);
    margin: 0 0 24px;
    font-size: 14px;
  }
  .auth-box input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text);
    font-size: 15px;
  }
  .auth-box input::placeholder {
    color: #a6aab8;
  }
  .auth-box button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  .auth-switch {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-dim);
  }
  .auth-switch a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
  }
  #auth-error {
    color: #d64545;
    font-size: 13px;
    margin-bottom: 10px;
    min-height: 16px;
  }
  .hidden { display: none !important; }

  /* ---- App ---- */
  #app {
    height: 100vh;
    grid-template-columns: 260px 1fr;
    display: grid;
  }
  #sidebar {
    background: var(--panel);
    padding: 16px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 16px;
    margin: 0 0 12px;
    color: var(--text);
  }
  #new-conv-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .conv-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv-item:hover, .conv-item.active {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  #user-bar {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
  }
  #logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 12px;
  }

  #main {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble-ai);
    color: var(--bubble-ai-text);
    border-bottom-left-radius: 4px;
  }
  .msg img {
    max-width: 100%;
    border-radius: 10px;
    display: block;
  }

  #input-bar {
    padding: 16px 24px 24px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  #input-bar input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
  }
  #input-bar button {
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  #send-btn { background: var(--accent); color: var(--accent-text); }
  #image-btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

  .typing { color: var(--text-dim); font-size: 13px; padding-left: 24px; }
</style>
</head>
<body>

<!-- ============== SCHERMATA LOGIN / REGISTRAZIONE ============== -->
<div id="auth-screen" class="{{ '' if not logged_in else 'hidden' }}">
  <div class="auth-box">
    <h1 id="auth-title">Accedi a Tink</h1>
    <p class="subtitle" id="auth-subtitle">Devi registrarti per poter chattare con l'IA.</p>
    <div id="auth-error"></div>

    <input type="text" id="reg-username" placeholder="Nome utente" autocomplete="username" class="hidden">
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">

    <button id="auth-submit" onclick="doLogin()">Accedi</button>
    <div class="auth-switch">
      <span id="switch-text">Non hai un account? </span>
      <a onclick="toggleAuthMode()" id="switch-link">Registrati</a>
    </div>
  </div>
</div>

<!-- ============== APP CHAT ============== -->
<div id="app" class="{{ 'hidden' if not logged_in else '' }}">
  <div id="sidebar">
    <h2>Tink</h2>
    <button id="new-conv-btn" onclick="newConversation()">+ Nuova conversazione</button>
    <div id="conv-list"></div>
    <div id="user-bar">
      <span id="username-label">{{ username if logged_in }}</span>
      <button id="logout-btn" onclick="doLogout()">Esci</button>
    </div>
  </div>
  <div id="main">
    <div id="messages"></div>
    <div class="typing hidden" id="typing-indicator">Tink sta scrivendo...</div>
    <div id="input-bar">
      <input type="text" id="message-input" placeholder="Scrivi un messaggio..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="image-btn" onclick="sendImagePrompt()">🖼️ Immagine</button>
      <button id="send-btn" onclick="sendMessage()">Invia</button>
    </div>
  </div>
</div>

<script>
let isRegisterMode = false;
let currentConversationId = null;

// ---------- Auth ----------
function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  document.getElementById('auth-title').innerText = isRegisterMode ? 'Crea un account' : 'Accedi a Tink';
  document.getElementById('auth-subtitle').innerText = isRegisterMode
    ? "Crea un account per iniziare a chattare con l'IA."
    : "Devi registrarti per poter chattare con l'IA.";
  document.getElementById('auth-submit').innerText = isRegisterMode ? 'Registrati' : 'Accedi';
  document.getElementById('switch-text').innerText = isRegisterMode ? 'Hai già un account? ' : 'Non hai un account? ';
  document.getElementById('switch-link').innerText = isRegisterMode ? 'Accedi' : 'Registrati';
  document.getElementById('auth-error').innerText = '';
  document.getElementById('reg-username').classList.toggle('hidden', !isRegisterMode);
}

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('auth-error');
  errorBox.innerText = '';

  let endpoint = '/api/login';
  let body = { email, password };

  if (isRegisterMode) {
    const username = document.getElementById('reg-username').value.trim();
    endpoint = '/api/register';
    body = { username, email, password };
  }

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (!res.ok) {
      errorBox.innerText = data.error || 'Errore, riprova.';
      return;
    }
    location.reload();
  } catch (err) {
    errorBox.innerText = 'Impossibile contattare il server. Riprova tra poco.';
  }
}

async function doLogout() {
  try {
    await fetch('/api/logout', { method: 'POST' });
  } catch (err) {
    // Se la richiesta fallisce, ricarichiamo comunque la pagina
  }
  location.reload();
}

// ---------- Conversazioni ----------
async function loadConversations() {
  try {
    const res = await fetch('/api/conversations');
    if (!res.ok) return;
    const convs = await res.json();
    const list = document.getElementById('conv-list');
    list.innerHTML = '';
    convs.forEach(c => {
      const div = document.createElement('div');
      div.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');
      div.innerText = c.title || 'Nuova conversazione';
      div.onclick = () => loadConversation(c.id);
      list.appendChild(div);
    });
  } catch (err) {
    console.error('Errore nel caricare le conversazioni', err);
  }
}

async function newConversation() {
  try {
    const res = await fetch('/api/conversations/new', { method: 'POST' });
    if (!res.ok) return;
    const data = await res.json();
    currentConversationId = data.conversation_id;
    document.getElementById('messages').innerHTML = '';
    loadConversations();
  } catch (err) {
    console.error('Errore nel creare una nuova conversazione', err);
  }
}

async function loadConversation(id) {
  try {
    const res = await fetch(`/api/conversations/${id}/messages`);
    if (!res.ok) return;
    const messages = await res.json();
    currentConversationId = id;
    const box = document.getElementById('messages');
    box.innerHTML = '';
    messages.forEach(m => renderMessage(m.role, m.content, m.image_base64));
    loadConversations();
  } catch (err) {
    console.error('Errore nel caricare la conversazione', err);
  }
}

// ---------- Messaggi ----------
function renderMessage(role, content, imageBase64) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (imageBase64) {
    const img = document.createElement('img');
    img.src = 'data:image/png;base64,' + imageBase64;
    div.appendChild(img);
  } else {
    div.innerText = content || '';
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function setTyping(visible) {
  document.getElementById('typing-indicator').classList.toggle('hidden', !visible);
}

async function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  renderMessage('user', text, null);
  setTyping(true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    setTyping(false);
    if (res.ok) {
      currentConversationId = data.conversation_id;
      renderMessage('assistant', data.reply, null);
      loadConversations();
    } else {
      renderMessage('assistant', 'Errore: ' + (data.error || 'sconosciuto'), null);
    }
  } catch (err) {
    setTyping(false);
    renderMessage('assistant', 'Errore di connessione al server: ' + err.message, null);
  }
}

async function sendImagePrompt() {
  const prompt = window.prompt("Descrivi l'immagine da generare:");
  if (!prompt) return;
  renderMessage('user', '[Immagine] ' + prompt, null);
  setTyping(true);

  try {
    const res = await fetch('/api/generate-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();
    setTyping(false);
    if (res.ok) {
      currentConversationId = data.conversation_id;
      renderMessage('assistant', null, data.image_base64);
      loadConversations();
    } else {
      renderMessage('assistant', 'Errore: ' + (data.error || 'sconosciuto'), null);
    }
  } catch (err) {
    setTyping(false);
    renderMessage('assistant', 'Errore di connessione al server: ' + err.message, null);
  }
}

// ---------- Init ----------
{% if logged_in %}
loadConversations();
{% endif %}
</script>

</body>
</html>
